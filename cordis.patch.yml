# dsh-proxy bundle patch
#
# Official install:
#   dsh plugin --profile web add dsh-proxy
#   dsh plugin --profile web add github:BuLongY/dsh-proxy
#
# The CLI reconciles dsh.profile.bundles from this dsh.bundle.patch declaration.
# Optional composition override:
#
#   - insert:
#       - id: dsh-proxy
#         name: dsh-proxy
#         config:
#           proxyUrl: http://127.0.0.1:7890
- insert:
    - id: dsh-proxy
      name: dsh-proxy
